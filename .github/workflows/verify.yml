name: Verify backend
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ucc_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres -d ucc_ci_test'
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable runner-local database only; no production credentials.
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/ucc_ci_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:integration
      - run: npm run build
